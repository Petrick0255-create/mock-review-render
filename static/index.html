<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PDF 비교">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
    <title>PDF NOTE COMPARE</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-dot"></span><span>PDF NOTE COMPARE</span></div>
        <div class="top-actions">
          <button id="openFiles" class="control" type="button">PDF 열기</button>
          <label class="check-control"><input id="syncPages" type="checkbox" checked><span>페이지 같이</span></label>
          <label class="check-control"><input id="syncScroll" type="checkbox" checked><span>스크롤 같이</span></label>
          <div class="zoom-control" aria-label="배율 설정">
            <button id="zoomOut" type="button" aria-label="축소">−</button>
            <label><input id="zoomValue" type="number" min="40" max="300" step="5" value="100"><span>%</span></label>
            <button id="zoomIn" type="button" aria-label="확대">＋</button>
          </div>
          <div class="mode-switch" role="group" aria-label="조작 모드">
            <button class="mode active" data-mode="view" type="button">이동</button>
            <button class="mode" data-mode="ink" type="button">필기</button>
          </div>
          <button id="fullscreen" class="icon-control" type="button" aria-label="전체 화면" title="전체 화면">⛶</button>
        </div>
      </header>

      <div id="inkToolbar" class="ink-toolbar" aria-hidden="true">
        <div class="tool-group" role="group" aria-label="필기 도구">
          <button class="tool active" data-tool="pen" type="button">펜</button>
          <button class="tool" data-tool="highlighter" type="button">형광펜</button>
          <button class="tool" data-tool="eraser" type="button">지우개</button>
        </div>
        <div class="colors" role="group" aria-label="색상">
          <button class="color active" data-color="#172033" style="--swatch:#172033" aria-label="검정" type="button"></button>
          <button class="color" data-color="#e3342f" style="--swatch:#e3342f" aria-label="빨강" type="button"></button>
          <button class="color" data-color="#2474e5" style="--swatch:#2474e5" aria-label="파랑" type="button"></button>
          <button class="color" data-color="#15a36d" style="--swatch:#15a36d" aria-label="초록" type="button"></button>
          <button class="color" data-color="#ffd84d" style="--swatch:#ffd84d" aria-label="노랑" type="button"></button>
        </div>
        <label class="stroke-size">굵기 <input id="strokeWidth" type="range" min="1" max="18" value="3"></label>
        <span class="toolbar-spacer"></span>
        <button id="undo" class="control" type="button">실행 취소</button>
        <button id="clearInk" class="control danger" type="button">현재 쪽 지우기</button>
      </div>

      <main class="viewer-grid">
        <section class="pdf-pane" data-side="left">
          <header class="pane-header">
            <div><span class="pane-label">문제</span><span id="leftName" class="file-name">PDF를 열어 주세요</span></div>
            <div class="page-control">
              <button id="leftPrev" type="button" aria-label="이전 페이지">‹</button>
              <label><input id="leftPage" type="number" min="1" value="1" aria-label="문제 페이지"><span>/ <b id="leftTotal">0</b></span></label>
              <button id="leftNext" type="button" aria-label="다음 페이지">›</button>
            </div>
          </header>
          <div id="leftViewport" class="viewport">
            <div id="leftStage" class="page-stage hidden">
              <canvas id="leftPdf" class="pdf-canvas"></canvas>
              <canvas id="leftInk" class="ink-canvas"></canvas>
            </div>
            <div id="leftEmpty" class="empty-state"><b>문제 PDF</b><span>파일을 열면 여기에 표시됩니다.</span></div>
          </div>
        </section>

        <div class="divider" aria-hidden="true"></div>

        <section class="pdf-pane" data-side="right">
          <header class="pane-header">
            <div><span class="pane-label solution">해설</span><span id="rightName" class="file-name">PDF를 열어 주세요</span></div>
            <div class="page-control">
              <button id="rightPrev" type="button" aria-label="이전 페이지">‹</button>
              <label><input id="rightPage" type="number" min="1" value="1" aria-label="해설 페이지"><span>/ <b id="rightTotal">0</b></span></label>
              <button id="rightNext" type="button" aria-label="다음 페이지">›</button>
            </div>
          </header>
          <div id="rightViewport" class="viewport">
            <div id="rightStage" class="page-stage hidden">
              <canvas id="rightPdf" class="pdf-canvas"></canvas>
              <canvas id="rightInk" class="ink-canvas"></canvas>
            </div>
            <div id="rightEmpty" class="empty-state"><b>해설 PDF</b><span>파일을 열면 여기에 표시됩니다.</span></div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="fileDialog">
      <form method="dialog" class="dialog-card" id="fileForm">
        <div class="dialog-title"><div><span>PDF 준비</span><h1>문제와 해설을 나란히 엽니다</h1></div><button id="closeDialog" class="close" value="cancel" type="submit" aria-label="닫기">×</button></div>
        <div class="drop-grid">
          <label class="dropzone" id="leftDrop">
            <input id="leftFile" type="file" accept="application/pdf,.pdf">
            <span class="drop-badge">문제</span><b>문제 PDF 놓기</b><small id="leftPicked">탭해서 파일 선택도 가능합니다</small>
          </label>
          <label class="dropzone" id="rightDrop">
            <input id="rightFile" type="file" accept="application/pdf,.pdf">
            <span class="drop-badge solution">해설</span><b>해설 PDF 놓기</b><small id="rightPicked">탭해서 파일 선택도 가능합니다</small>
          </label>
        </div>
        <p class="privacy">파일은 서버에 전송되지 않습니다. 이 기기의 브라우저에서만 열립니다.</p>
        <button id="loadPdfs" class="primary" type="button" disabled>두 PDF 열기</button>
      </form>
    </dialog>

    <div id="busy" class="busy hidden"><span></span><b>PDF 여는 중…</b></div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
